name: Bilingual Weekly Newsletter

on:
schedule:
# Saturday 07:00 Beijing time = Friday 23:00 UTC
- cron: "0 23 * * 5"

workflow_dispatch:

permissions:
contents: write

jobs:
generate-newsletter:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Generate bilingual newsletter
    run: python newsletter.py

  - name: Save newsletter to GitHub
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add newsletters/
      if ! git diff --cached --quiet; then
        git commit -m "docs: publish weekly newsletter"
        git push
      else
        echo "No new changes to save."
      fi